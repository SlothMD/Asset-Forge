version: 1
updated: 2026-05-18
stack:
  desktop_shell: Tauri v2
  frontend:
    framework: React 19
    language: TypeScript
    bundler: Vite
  native_backend:
    language: Rust
    boundary: Tauri commands
  package_manager: npm workspaces
  node_engine: ">=20"
